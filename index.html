}
function openKakaoRoom(id){
const r=rooms.find(x=>x.id===id);
if(!r||!r.messages)return;
activeRoom=r;
document.getElementById('kakaoListView').style.display='none';
const cv=document.getElementById('kakaoChatView');
cv.classList.remove('hidden');
cv.classList.add('active');
document.getElementById('chatTitle').innerHTML=r.name+(r.count?` <small>${r.count}</small>`:'');
const sc=document.getElementById('kakaoChatScroll');
sc.innerHTML='';
r.messages.forEach(m=>{
if(m[0]==='day'){
const d=document.createElement('div');
d.className='kakao-day';
d.textContent=m[1];
sc.appendChild(d);
return;
}
const mine=m[0]==='나';
const row=document.createElement('div');
row.className='kakao-message-row'+(mine?' mine':'');
if(!mine){
const av=document.createElement('div');
av.className='kakao-msg-avatar';
av.textContent=m[0].slice(0,1);
row.appendChild(av);
}
const wrap=document.createElement('div');
wrap.className='kakao-msg-wrap';
if(!mine){
const sender=document.createElement('div');
sender.className='kakao-sender';
sender.textContent=m[0];
wrap.appendChild(sender);
}
const line=document.createElement('div');
line.className='kakao-msg-line';
const bubble=document.createElement('div');
bubble.className='kakao-bubble';
bubble.textContent=m[1];
const time=document.createElement('span');
time.className='kakao-time';
time.textContent=m[2]||'';
line.append(bubble,time);
if(m[3]){
const read=document.createElement('span');
read.className='kakao-read';
read.textContent=m[3];
line.appendChild(read);
}
wrap.appendChild(line);
row.appendChild(wrap);
sc.appendChild(row);
});
setTimeout(()=>{sc.scrollTop=sc.scrollHeight},20);
}
function backToKakaoList(){
document.getElementById('kakaoChatView').classList.add('hidden');
document.getElementById('kakaoChatView').classList.remove('active');
document.getElementById('kakaoListView').style.display='block';
activeRoom=null;
}
function sendKakaoMessage(){
const input=document.getElementById('kakaoInput');
const value=input.value.trim();
if(!value||!activeRoom)return;
activeRoom.messages.push(['나',value,new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})]);
input.value='';
openKakaoRoom(activeRoom.id);
}
function openApp(id){
document.getElementById('home').style.display='none';
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelector('.dock').style.display='none';
if(id==='kakao'){backToKakaoList();renderRoomList();}
}
function goHome(){
document.getElementById('home').style.display='block';
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelector('.dock').style.display='grid';
}
function searchWeb(e){
e.preventDefault();
const q=document.getElementById('webQuery').value.trim();
if(q)document.getElementById('webResult').textContent='“'+q+'” 검색 결과는 시뮬레이터용 화면이야.';
}
const title=document.getElementById('noteTitle');
const note=document.getElementById('noteText');
title.value=localStorage.getItem('myNoteTitle')||'';
note.value=localStorage.getItem('myNoteText')||'';
title.addEventListener('input',()=>localStorage.setItem('myNoteTitle',title.value));
note.addEventListener('input',()=>localStorage.setItem('myNoteText',note.value));
renderRoomList();
</script>
